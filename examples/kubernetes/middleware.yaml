apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: state-geo-block
  namespace: traefik-system
spec:
  plugin:
    stateGeoBlock:
      dbPath: /data/geolite/GeoLite2-City.mmdb
      databaseReloadInterval: 1m
      # Starting point for an ingress handling many unique IPv4/IPv6 clients.
      # Tune from observed cache effectiveness and pod memory.
      cacheSize: 50000
      cacheTTL: 15m
      trustedProxyCIDRs:
        - 10.17.1.0/24
      clientIPHeaders:
        - X-Forwarded-For
      rejectInvalidClientIPHeaders: true
      blockNonUS: true
      blockUSStates: true
      blockedStates:
        - CA
        - NY
      databaseFailurePolicy: deny
      lookupFailurePolicy: deny
      invalidClientIPPolicy: deny
      unknownCountryPolicy: deny
      unknownSubdivisionPolicy: deny
      privateIPPolicy: deny
      whitelistedPaths:
        - /health
      whitelistedPathPrefixes:
        - /.well-known
      logLevel: info
      logClientIP: false
