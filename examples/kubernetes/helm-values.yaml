# Merge this fragment into the Traefik chart values.
# Replace vX.Y.Z and every example network with values validated for the cluster.
experimental:
  abortOnPluginFailure: true
  plugins:
    stateGeoBlock:
      moduleName: github.com/vikewoods/traefik-plugin-state-geo
      version: vX.Y.Z

deployment:
  additionalVolumes:
    - name: geolite-db
      persistentVolumeClaim:
        claimName: traefik-geolite-db

additionalVolumeMounts:
  - name: geolite-db
    mountPath: /data/geolite
    readOnly: true

# Read-only audit baseline: 91-98Mi in use, 192Mi requested, 512Mi limited
# before this plugin was enabled. 320Mi leaves canary scheduling headroom for
# the in-memory MMDB, an overlapping reload, cache entries, and GC variance.
resources:
  requests:
    cpu: 500m
    memory: 320Mi
  limits:
    memory: 512Mi

ports:
  websecure:
    forwardedHeaders:
      insecure: false
      trustedIPs:
        - 10.17.1.0/24
        # Add the current trusted CDN/proxy IPv4 and IPv6 ranges.
