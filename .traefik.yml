displayName: State Geo Block Middleware
type: middleware
import: github.com/vikewoods/traefik-plugin-state-geo
basePkg: traefik_plugin_state_geo
runtime: yaegi

summary: Blocks non-US traffic and selected US states using a mounted MaxMind City database.

testData:
  dbPath: testdata/GeoIP2-City-Test.mmdb
  databaseReloadInterval: 1m
  cacheSize: 100
  cacheTTL: 5m
  blockNonUS: true
  blockUSStates: true
  blockedStates:
    - CA
  clientIPHeaders:
    - CF-Connecting-IP
    - True-Client-IP
    - X-Forwarded-For
    - Forwarded
    - X-Real-IP
  trustedProxyCIDRs:
    - 127.0.0.0/8
  rejectInvalidClientIPHeaders: true
  whitelistedIPs:
    - 192.0.2.10
  whitelistedPaths:
    - /health
  whitelistedPathPrefixes:
    - /.well-known
  databaseFailurePolicy: error
  lookupFailurePolicy: deny
  invalidClientIPPolicy: deny
  unknownCountryPolicy: deny
  unknownSubdivisionPolicy: deny
  privateIPPolicy: deny
  logLevel: "off"
  templateHTML: |
    <!doctype html>
    <html lang="en">
      <body>
        <h1>Access denied</h1>
        <p>State: {{STATE}}</p>
      </body>
    </html>
